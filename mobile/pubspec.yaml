name: i_gen
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
    sdk: ">=3.12.2 <4.0.0"
    flutter: 3.44.6

dependencies:
    flutter:
        sdk: flutter

    sqflite_common_ffi: ^2.4.0
    sqflite: ^2.4.0
    sqlite3: ^3.0.0
    get_it: ^9.2.1
    flutter_localizations:
        sdk: flutter
    intl: ^0.20.2
    flutter_typeahead: ^6.0.0
    google_fonts: ^8.2.1
    trina_grid: ^2.3.0
    path_provider: ^2.1.5
    pdf: ^3.11.3
    path: ^1.9.1
    gal: ^2.3.2
    supabase_flutter: ^2.17.2
    connectivity_plus: ^7.3.1
    shared_preferences: ^2.5.5
    app_links: ^7.2.1
    flutter_local_notifications: ^22.3.1
    share_plus: ^13.3.0
    file_picker: ^13.1.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    msix: ^3.16.9

flutter:
    generate: true
    uses-material-design: true
    fonts:
        - family: Readex Pro
          fonts:
              - asset: assets/ReadexPro-VariableFont_wght.ttf
        - family: Noto Naskh Arabic
          fonts:
              - asset: assets/NotoNaskhArabic-VariableFont_wght.ttf
        - family: IBM Plex Sans Arabic
          fonts:
              - asset: assets/IBMPlexSansArabic-Regular.ttf
                weight: 400
              - asset: assets/IBMPlexSansArabic-Medium.ttf
                weight: 500
              - asset: assets/IBMPlexSansArabic-SemiBold.ttf
                weight: 600
    assets:
        - assets/

msix_config:
    display_name: InvoGen
    publisher_display_name: Mouayad Alhamwi
    identity_name: mouayad.invoGen
    msix_version: 1.0.0.0
    app_installer: #<-- app installer configuration
        publish_folder_path: c:\users\mouayad\desktop\InvoGen
        hours_between_update_checks: 0
        automatic_background_task: true
        update_blocks_activation: true
        show_prompt: true
        force_update_from_any_version: false
